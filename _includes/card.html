<article class="card">{% if post.cover %}<a tabindex="-1" aria-hidden="true" href="{{ post.url }}"><img src="{{ post.cover }}" alt="" loading="lazy" width="720" height="405"></a>{% endif %}<div class="card-body"><time datetime="{{ post.published_at }}">{{ post.date | date: '%Y.%m.%d' }}</time><h3><a href="{{ post.url }}">{{ post.title | escape }}</a></h3><p>{{ post.description | escape }}</p><div class="tags">{% for tag in post.tags %}<span>{{ tag | escape }}</span>{% endfor %}</div></div></article>
