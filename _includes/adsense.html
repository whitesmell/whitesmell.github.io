{% if jekyll.environment == 'production' and site.adsense_client %}
<meta name="google-adsense-account" content="{{ site.adsense_client | escape }}">
{% if page.layout == 'post' or page.url == '/' %}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client | escape }}" crossorigin="anonymous"></script>
{% endif %}
{% endif %}
